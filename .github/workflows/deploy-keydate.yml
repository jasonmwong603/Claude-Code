name: Deploy KeyDate to GitHub Pages

# Builds the KeyDate app (apps/keydate) and publishes it to GitHub Pages at
# /keydate/. The existing "My Money" budgeting app is included at /budgeting/ so
# nothing is lost when this branch is the Pages source.

on:
  push:
    branches: ["claude/app-development-publication-cuiwpm"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the "pages" concurrency group with the other deploy workflow so the two
# never publish at the same time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/keydate/package-lock.json

      - name: Build KeyDate
        working-directory: apps/keydate
        # Optional Supabase auth. Set these as repository Actions *variables*
        # (Settings → Secrets and variables → Actions → Variables) — the anon
        # key is public and safe to expose. Left unset, the app runs in guest
        # mode with sign-in hidden.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/app _site/budgeting
          # The KeyDate app is served at keydate.ca/app/ (base is relative).
          cp -r apps/keydate/dist/* _site/app/
          # Keep the existing budgeting app published alongside KeyDate.
          cp budget.html _site/budgeting/index.html
          # Marketing / waitlist landing page at the site root (keydate.ca/).
          cp landing.html _site/index.html
          # Custom domain (keydate.ca): kept OUT until DNS is configured, so the
          # live github.io URL isn't redirected to a domain that can't resolve
          # yet. Once the DNS records below are added, uncomment to activate:
          #   echo 'keydate.ca' > _site/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
