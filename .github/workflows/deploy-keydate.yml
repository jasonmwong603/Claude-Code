name: Deploy KeyDate to GitHub Pages

# Builds the KeyDate app (apps/keydate) and publishes it to GitHub Pages at
# /keydate/. The existing "My Money" budgeting app is included at /budgeting/ so
# nothing is lost when this branch is the Pages source.

on:
  push:
    branches: ["claude/app-development-publication-cuiwpm"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the "pages" concurrency group with the other deploy workflow so the two
# never publish at the same time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/keydate/package-lock.json

      - name: Build KeyDate
        working-directory: apps/keydate
        # Optional Supabase auth. Set these as repository Actions *variables*
        # (Settings → Secrets and variables → Actions → Variables) — the anon
        # key is public and safe to expose. Left unset, the app runs in guest
        # mode with sign-in hidden.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/app _site/prelaunchdemo
          # The same build is served at two paths (base is relative, so it works
          # from either):
          #   /app/           → the PUBLIC beta, open to testers (no passcode)
          #   /prelaunchdemo/ → the PRIVATE investor demo, passcode-gated
          # PasscodeGate checks the path and only gates /prelaunchdemo/.
          cp -r apps/keydate/dist/* _site/app/
          cp -r apps/keydate/dist/* _site/prelaunchdemo/
          # (The budgeting/money tool is intentionally NOT published here — it
          # lives in its own separate repo at jasonmwong603.github.io/steadybudgeting,
          # so keydate.ca is KeyDate only.)
          # Marketing / waitlist landing page at the site root (keydate.ca/).
          cp landing.html _site/index.html
          # Private, passcode-gated admin metrics console (keydate.ca/admin/).
          mkdir -p _site/admin
          cp admin.html _site/admin/index.html
          # Legal pages (keydate.ca/privacy/ and /terms/).
          mkdir -p _site/privacy _site/terms
          cp privacy.html _site/privacy/index.html
          cp terms.html _site/terms/index.html
          # Vendored libraries served from our own domain (no external CDN).
          cp -r vendor _site/vendor
          # Custom domain for GitHub Pages — DNS verified, so this is active.
          echo 'keydate.ca' > _site/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
