name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/monthly-budgeting-app-dpc0jn"]
  workflow_dispatch:

# Permissions needed for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          # Serve the app at /budgeting/ …
          mkdir -p _site/budgeting
          cp budget.html _site/budgeting/index.html
          # … and redirect the bare repo URL to it for convenience.
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./budgeting/"><title>My Money</title><a href="./budgeting/">Open My Money →</a>\n' > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically if it isn't already (needs a public repo
          # on free plans, or GitHub Pro for a private repo).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
