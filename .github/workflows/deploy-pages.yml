name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/monthly-budgeting-app-dpc0jn"]
  workflow_dispatch:

# Permissions needed for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          # Serve the monthly budget app at /budgeting/ and Steady at /steady/ …
          mkdir -p _site/budgeting _site/steady
          cp budget.html _site/budgeting/index.html
          cp steady.html _site/steady/index.html
          # … and give the bare repo URL a small chooser page.
          printf '%s' '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Money</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;max-width:520px;margin:12vh auto;padding:24px;text-align:center;color:#36323E;background:#F1F8F3}a{display:block;margin:14px 0;padding:16px;border-radius:14px;background:#fff;font-size:18px;font-weight:700;color:#2FA66B;text-decoration:none;box-shadow:0 2px 14px rgba(54,50,62,.06)}p{color:#7A7286}</style><h1>My Money</h1><p>Pick a tool</p><a href="./budgeting/">💰 Monthly budget</a><a href="./steady/">📆 Steady — daily earnings &amp; smoothing</a>' > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically if it isn't already (needs a public repo
          # on free plans, or GitHub Pro for a private repo).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
