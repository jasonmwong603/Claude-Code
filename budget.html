<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f172a" />
<title>Monthly Budget</title>
<style>
:root {
  --bg: #0b1120;
  --bg-elev: #111a2e;
  --card: #16213a;
  --border: #26324a;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --income: #22c55e;
  --expense: #f87171;
  --danger: #ef4444;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: radial-gradient(1200px 600px at 100% -10%, #1e293b 0%, transparent 60%), var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 1080px; margin: 0 auto; padding: 20px 20px 60px; min-height: 100%; display: flex; flex-direction: column; }
.app__header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 8px 0 16px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand__mark { font-size: 26px; color: var(--primary); }
.brand h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.month-nav { display: flex; align-items: center; gap: 8px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 999px; padding: 4px; }
.month-nav__label { min-width: 150px; text-align: center; font-weight: 600; display: flex; flex-direction: column; line-height: 1.1; }
.month-nav__label .link-btn { font-size: 11px; font-weight: 500; }
.tabs { display: flex; gap: 4px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: 4px; width: fit-content; margin-bottom: 18px; }
.tab { border: none; background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
.tab--active { background: var(--primary); color: white; }
.app__main { flex: 1; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 16px; font-weight: 700; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 640px) { .summary { grid-template-columns: 1fr; } }
.summary__card { display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; }
.summary__label { font-size: 13px; color: var(--muted); }
.summary__value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.summary__hint { font-size: 12px; color: var(--muted); }
.progress-list { display: flex; flex-direction: column; gap: 16px; }
.progress-row__head, .progress-row__foot { display: flex; justify-content: space-between; align-items: center; }
.progress-row__name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.progress-row__amounts { font-size: 14px; }
.progress-row__foot { margin-top: 6px; font-size: 12px; }
.bar { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-top: 8px; border: 1px solid var(--border); }
.bar__fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
.bar__fill--over { background: repeating-linear-gradient(45deg, var(--expense), var(--expense) 6px, #dc2626 6px, #dc2626 12px); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.tx-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tx-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
.tx-item:last-child { border-bottom: none; }
.tx-item__main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.tx-item__title { font-weight: 600; font-size: 14px; }
.tx-item__sub { font-size: 12px; }
.tx-item__amount { font-weight: 700; font-variant-numeric: tabular-nums; }
.tx-item__actions { display: flex; gap: 2px; opacity: 0.6; transition: opacity 0.15s ease; }
.tx-item:hover .tx-item__actions { opacity: 1; }
.cat-list { list-style: none; margin: 0 0 18px; padding: 0; }
.cat-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
.cat-row__name { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.cat-row__budget { font-variant-numeric: tabular-nums; font-weight: 600; }
.cat-row__input { width: 100px; }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 6px; border-radius: 6px; font-weight: 700; }
.tag--income { background: rgba(34, 197, 94, 0.15); color: var(--income); }
.tag--expense { background: rgba(248, 113, 113, 0.12); color: var(--expense); }
.cat-add { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px dashed var(--border); }
.cat-add__row { display: flex; gap: 10px; }
.cat-add__row select, .cat-add__row input { flex: 1; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch--active { border-color: var(--text); transform: scale(1.1); }
.data-actions { display: flex; gap: 10px; margin: 8px 0 14px; }
.data-actions .btn { flex: 1; }
.privacy-note { font-size: 12px; color: var(--muted); margin: 16px 0 0; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 600; }
input, select { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 10px 12px; font-size: 14px; font-family: inherit; width: 100%; }
input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
.form-error { color: var(--expense); font-size: 13px; margin: 0 0 12px; }
.tx-form__actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
.btn { border: 1px solid transparent; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s ease; }
.btn--primary { background: var(--primary); color: white; }
.btn--primary:hover { background: var(--primary-hover); }
.btn--ghost { background: transparent; border-color: var(--border); color: var(--text); }
.btn--ghost:hover { border-color: var(--muted); }
.btn--danger { background: transparent; border-color: rgba(239, 68, 68, 0.5); color: var(--danger); }
.btn--danger:hover { background: rgba(239, 68, 68, 0.12); }
.btn--block { width: 100%; }
.icon-btn { background: transparent; border: none; color: var(--text); font-size: 20px; line-height: 1; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; transition: background 0.15s ease; }
.icon-btn:hover { background: rgba(255, 255, 255, 0.08); }
.icon-btn--sm { font-size: 13px; width: 26px; height: 26px; color: var(--muted); }
.link-btn { background: none; border: none; color: var(--primary); cursor: pointer; padding: 0; font-size: 13px; font-weight: 600; font-family: inherit; }
.link-btn:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.income { color: var(--income); }
.expense { color: var(--expense); }
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
.modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.modal__backdrop { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(2px); }
.modal__panel { position: relative; width: 100%; max-width: 420px; z-index: 1; }
.app__footer { text-align: center; color: var(--muted); font-size: 12px; padding-top: 30px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';

  // ---- Helpers ------------------------------------------------------------
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function currentMonthKey() { return monthKey(new Date()); }
  function monthOf(iso) { return iso.slice(0, 7); }
  function formatMonth(key) {
    var p = key.split('-').map(Number);
    return new Date(p[0], p[1] - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }
  function shiftMonth(key, delta) {
    var p = key.split('-').map(Number);
    return monthKey(new Date(p[0], p[1] - 1 + delta, 1));
  }
  function formatCurrency(value, currency) {
    try {
      return new Intl.NumberFormat(undefined, { style: 'currency', currency: currency, maximumFractionDigits: 2 }).format(value);
    } catch (e) { return value.toFixed(2); }
  }
  function todayIso() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function formatDay(iso) {
    var p = iso.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---- Storage ------------------------------------------------------------
  var STORAGE_KEY = 'monthly-budget:v1';
  var PALETTE = ['#ef4444', '#f97316', '#f59e0b', '#22c55e', '#14b8a6', '#0ea5e9', '#3b82f6', '#a855f7', '#ec4899', '#64748b'];
  var CURRENCIES = ['USD', 'EUR', 'GBP', 'CAD', 'AUD', 'JPY', 'INR', 'CNY', 'BRL', 'MXN'];

  function defaultState() {
    return {
      currency: 'USD',
      transactions: [],
      categories: [
        { id: uid(), name: 'Salary', type: 'income', budget: 4000, color: '#22c55e' },
        { id: uid(), name: 'Rent', type: 'expense', budget: 1500, color: '#ef4444' },
        { id: uid(), name: 'Groceries', type: 'expense', budget: 500, color: '#f97316' },
        { id: uid(), name: 'Transport', type: 'expense', budget: 150, color: '#3b82f6' },
        { id: uid(), name: 'Dining', type: 'expense', budget: 200, color: '#a855f7' },
        { id: uid(), name: 'Utilities', type: 'expense', budget: 250, color: '#14b8a6' },
        { id: uid(), name: 'Fun', type: 'expense', budget: 150, color: '#ec4899' },
        { id: uid(), name: 'Savings', type: 'expense', budget: 400, color: '#0ea5e9' }
      ]
    };
  }
  function isValidState(v) {
    return v && typeof v === 'object' && Array.isArray(v.categories) && Array.isArray(v.transactions) && typeof v.currency === 'string';
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      return isValidState(parsed) ? parsed : defaultState();
    } catch (e) { return defaultState(); }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---- App state ----------------------------------------------------------
  var state = loadState();
  var ui = { month: currentMonthKey(), tab: 'overview', form: null, editingCatId: null, focusAfter: null };

  function categoriesById() {
    var m = {};
    state.categories.forEach(function (c) { m[c.id] = c; });
    return m;
  }

  function summarize(month) {
    var monthTx = state.transactions.filter(function (t) { return monthOf(t.date) === month; });
    var cats = state.categories.map(function (category) {
      var txs = monthTx.filter(function (t) { return t.categoryId === category.id; });
      var actual = txs.reduce(function (s, t) { return s + t.amount; }, 0);
      var budget = category.budget;
      return {
        category: category, actual: actual, budget: budget,
        remaining: budget - actual,
        ratio: budget > 0 ? actual / budget : (actual > 0 ? 1 : 0),
        transactionCount: txs.length
      };
    });
    var sum = function (arr) { return arr.reduce(function (s, c) { return s + c.actual; }, 0); };
    var income = sum(cats.filter(function (c) { return c.category.type === 'income'; }));
    var expenses = sum(cats.filter(function (c) { return c.category.type === 'expense'; }));
    var plannedIncome = state.categories.filter(function (c) { return c.type === 'income'; }).reduce(function (s, c) { return s + c.budget; }, 0);
    var plannedExpenses = state.categories.filter(function (c) { return c.type === 'expense'; }).reduce(function (s, c) { return s + c.budget; }, 0);
    return {
      income: income, expenses: expenses, plannedIncome: plannedIncome, plannedExpenses: plannedExpenses,
      net: income - expenses, plannedNet: plannedIncome - plannedExpenses, categories: cats
    };
  }

  function transactionsForMonth(month) {
    return state.transactions
      .filter(function (t) { return monthOf(t.date) === month; })
      .sort(function (a, b) { return b.date.localeCompare(a.date); });
  }

  // ---- Actions ------------------------------------------------------------
  function commit() { saveState(); render(); }

  var actions = {
    addTransaction: function (tx) { tx.id = uid(); state.transactions.push(tx); },
    updateTransaction: function (id, patch) {
      state.transactions = state.transactions.map(function (t) { return t.id === id ? Object.assign({}, t, patch) : t; });
    },
    deleteTransaction: function (id) { state.transactions = state.transactions.filter(function (t) { return t.id !== id; }); },
    addCategory: function (c) { c.id = uid(); state.categories.push(c); },
    updateCategory: function (id, patch) {
      state.categories = state.categories.map(function (c) { return c.id === id ? Object.assign({}, c, patch) : c; });
    },
    deleteCategory: function (id) {
      state.categories = state.categories.filter(function (c) { return c.id !== id; });
      state.transactions = state.transactions.filter(function (t) { return t.categoryId !== id; });
    },
    setCurrency: function (cur) { state.currency = cur; },
    resetAll: function () { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} state = defaultState(); }
  };

  // ---- Views (return HTML strings) ---------------------------------------
  function monthNav() {
    var isCurrent = ui.month === currentMonthKey();
    return '<div class="month-nav">' +
      '<button class="icon-btn" data-act="prev-month" aria-label="Previous month">‹</button>' +
      '<div class="month-nav__label"><span>' + esc(formatMonth(ui.month)) + '</span>' +
      (isCurrent ? '' : '<button class="link-btn" data-act="today">Jump to today</button>') +
      '</div>' +
      '<button class="icon-btn" data-act="next-month" aria-label="Next month">›</button>' +
    '</div>';
  }

  function summaryCards(s) {
    var cur = state.currency;
    var spentRatio = s.plannedExpenses > 0 ? s.expenses / s.plannedExpenses : 0;
    var netPositive = s.net >= 0;
    return '<div class="summary">' +
      '<div class="card summary__card"><span class="summary__label">Income</span>' +
        '<span class="summary__value income">' + esc(formatCurrency(s.income, cur)) + '</span>' +
        '<span class="summary__hint">planned ' + esc(formatCurrency(s.plannedIncome, cur)) + '</span></div>' +
      '<div class="card summary__card"><span class="summary__label">Expenses</span>' +
        '<span class="summary__value expense">' + esc(formatCurrency(s.expenses, cur)) + '</span>' +
        '<span class="summary__hint">planned ' + esc(formatCurrency(s.plannedExpenses, cur)) + '</span></div>' +
      '<div class="card summary__card"><span class="summary__label">' + (netPositive ? 'Left over' : 'Over budget') + '</span>' +
        '<span class="summary__value ' + (netPositive ? 'income' : 'expense') + '">' + esc(formatCurrency(s.net, cur)) + '</span>' +
        '<span class="summary__hint">' + Math.round(spentRatio * 100) + '% of planned spending used</span></div>' +
    '</div>';
  }

  function progressRow(cs) {
    var cur = state.currency, c = cs.category;
    var over = c.type === 'expense' && cs.actual > cs.budget && cs.budget > 0;
    var pct = Math.min(cs.ratio, 1) * 100;
    var foot;
    if (c.type === 'expense') {
      foot = over ? (formatCurrency(-cs.remaining, cur) + ' over budget') : (formatCurrency(cs.remaining, cur) + ' left');
    } else {
      foot = formatCurrency(cs.remaining, cur) + ' to goal';
    }
    return '<div class="progress-row">' +
      '<div class="progress-row__head"><span class="progress-row__name">' +
        '<span class="dot" style="background-color:' + esc(c.color) + '"></span>' + esc(c.name) + '</span>' +
        '<span class="progress-row__amounts"><strong>' + esc(formatCurrency(cs.actual, cur)) + '</strong>' +
        '<span class="muted"> / ' + esc(formatCurrency(cs.budget, cur)) + '</span></span></div>' +
      '<div class="bar"><div class="bar__fill' + (over ? ' bar__fill--over' : '') + '" style="width:' + pct + '%;' +
        (over ? '' : 'background-color:' + esc(c.color)) + '"></div></div>' +
      '<div class="progress-row__foot"><span class="muted ' + (over ? 'expense' : '') + '">' + esc(foot) + '</span>' +
        '<button class="link-btn" data-act="quick-add" data-id="' + c.id + '">+ Add</button></div>' +
    '</div>';
  }

  function categoryProgress(s) {
    if (s.categories.length === 0) {
      return '<div class="card empty">No categories yet. Add one from the Manage tab to get started.</div>';
    }
    var expenses = s.categories.filter(function (c) { return c.category.type === 'expense'; });
    var income = s.categories.filter(function (c) { return c.category.type === 'income'; });
    var html = '<div class="card"><h2 class="section-title">Spending by category</h2>' +
      '<div class="progress-list">' + expenses.map(progressRow).join('') + '</div>';
    if (income.length) {
      html += '<h2 class="section-title" style="margin-top:24px">Income sources</h2>' +
        '<div class="progress-list">' + income.map(progressRow).join('') + '</div>';
    }
    return html + '</div>';
  }

  function transactionList() {
    var cur = state.currency, byId = categoriesById();
    var txs = transactionsForMonth(ui.month);
    var body;
    if (txs.length === 0) {
      body = '<div class="empty">No transactions this month yet. Add one to see it here.</div>';
    } else {
      body = '<ul class="tx-list">' + txs.map(function (tx) {
        var c = byId[tx.categoryId];
        var isIncome = c && c.type === 'income';
        return '<li class="tx-item">' +
          '<span class="dot" style="background-color:' + esc(c ? c.color : '#94a3b8') + '"></span>' +
          '<div class="tx-item__main"><span class="tx-item__title">' + esc(c ? c.name : 'Uncategorized') + '</span>' +
          '<span class="muted tx-item__sub">' + esc(formatDay(tx.date)) + (tx.note ? ' · ' + esc(tx.note) : '') + '</span></div>' +
          '<span class="tx-item__amount ' + (isIncome ? 'income' : 'expense') + '">' + (isIncome ? '+' : '−') + esc(formatCurrency(tx.amount, cur)) + '</span>' +
          '<div class="tx-item__actions">' +
            '<button class="icon-btn icon-btn--sm" data-act="edit-tx" data-id="' + tx.id + '" aria-label="Edit">✎</button>' +
            '<button class="icon-btn icon-btn--sm" data-act="del-tx" data-id="' + tx.id + '" aria-label="Delete">✕</button>' +
          '</div></li>';
      }).join('') + '</ul>';
    }
    return '<div class="card"><h2 class="section-title">Transactions <span class="muted"> · ' + txs.length + '</span></h2>' + body + '</div>';
  }

  function categoryManager() {
    var cur = state.currency;
    var rows = state.categories.map(function (c) {
      var right;
      if (ui.editingCatId === c.id) {
        right = '<input class="cat-row__input" type="number" min="0" step="0.01" value="' + esc(c.budget) +
          '" data-role="cat-budget-input" data-id="' + c.id + '" />';
      } else {
        right = '<button class="cat-row__budget link-btn" data-act="edit-cat" data-id="' + c.id + '" title="Click to edit budget">' +
          esc(formatCurrency(c.budget, cur)) + '</button>';
      }
      return '<li class="cat-row">' +
        '<span class="dot" style="background-color:' + esc(c.color) + '"></span>' +
        '<span class="cat-row__name">' + esc(c.name) + '<span class="tag tag--' + c.type + '">' + c.type + '</span></span>' +
        right +
        '<button class="icon-btn icon-btn--sm" data-act="del-cat" data-id="' + c.id + '" aria-label="Delete">✕</button>' +
      '</li>';
    }).join('');

    var swatches = PALETTE.map(function (p, i) {
      return '<button type="button" class="swatch' + (i === 0 ? ' swatch--active' : '') + '" data-role="swatch" data-color="' + p +
        '" style="background-color:' + p + '" aria-label="color"></button>';
    }).join('');

    return '<div class="card"><h2 class="section-title">Categories &amp; budgets</h2>' +
      '<ul class="cat-list">' + rows + '</ul>' +
      '<form class="cat-add" data-role="cat-add">' +
        '<input type="text" data-role="cat-name" placeholder="New category" />' +
        '<div class="cat-add__row">' +
          '<select data-role="cat-type"><option value="expense">Expense</option><option value="income">Income</option></select>' +
          '<input type="number" min="0" step="0.01" data-role="cat-budget" placeholder="Budget" />' +
        '</div>' +
        '<div class="swatches">' + swatches + '</div>' +
        '<button type="submit" class="btn btn--primary btn--block">Add category</button>' +
      '</form></div>';
  }

  function dataPanel() {
    var opts = CURRENCIES.map(function (c) {
      return '<option value="' + c + '"' + (c === state.currency ? ' selected' : '') + '>' + c + '</option>';
    }).join('');
    return '<div class="card"><h2 class="section-title">Settings &amp; data</h2>' +
      '<label class="field"><span>Currency</span><select data-role="currency">' + opts + '</select></label>' +
      '<div class="data-actions">' +
        '<button class="btn btn--ghost" data-act="export">Export backup</button>' +
        '<button class="btn btn--ghost" data-act="import">Import backup</button>' +
        '<input type="file" accept="application/json" data-role="import-file" hidden />' +
      '</div>' +
      '<button class="btn btn--danger btn--block" data-act="reset">Reset all data</button>' +
      '<p class="privacy-note">Your data never leaves this browser — it is stored locally on your device. Use “Export backup” to keep a copy.</p>' +
    '</div>';
  }

  function transactionModal() {
    if (!ui.form) return '';
    var editing = ui.form.editing;
    var preCat = editing ? editing.categoryId : (ui.form.categoryId || (state.categories[0] && state.categories[0].id) || '');
    var expenseOpts = state.categories.filter(function (c) { return c.type === 'expense'; })
      .map(function (c) { return '<option value="' + c.id + '"' + (c.id === preCat ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('');
    var incomeOpts = state.categories.filter(function (c) { return c.type === 'income'; })
      .map(function (c) { return '<option value="' + c.id + '"' + (c.id === preCat ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('');
    return '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal__backdrop" data-act="close-modal"></div>' +
      '<div class="modal__panel card"><form data-role="tx-form">' +
        '<h2 class="section-title">' + (editing ? 'Edit transaction' : 'Add transaction') + '</h2>' +
        '<label class="field"><span>Amount</span><input type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" data-role="tx-amount" value="' + (editing ? esc(editing.amount) : '') + '" /></label>' +
        '<label class="field"><span>Category</span><select data-role="tx-category">' +
          '<optgroup label="Expenses">' + expenseOpts + '</optgroup>' +
          '<optgroup label="Income">' + incomeOpts + '</optgroup>' +
        '</select></label>' +
        '<label class="field"><span>Date</span><input type="date" data-role="tx-date" value="' + esc(editing ? editing.date : todayIso()) + '" /></label>' +
        '<label class="field"><span>Note (optional)</span><input type="text" placeholder="e.g. Weekly shop" data-role="tx-note" value="' + (editing ? esc(editing.note) : '') + '" /></label>' +
        '<p class="form-error" data-role="tx-error" style="display:none"></p>' +
        '<div class="tx-form__actions">' +
          '<button type="button" class="btn btn--ghost" data-act="close-modal">Cancel</button>' +
          '<button type="submit" class="btn btn--primary">' + (editing ? 'Save' : 'Add') + '</button>' +
        '</div>' +
      '</form></div></div>';
  }

  function render() {
    var s = summarize(ui.month);
    var main = ui.tab === 'overview'
      ? summaryCards(s) + '<div class="grid">' + categoryProgress(s) + transactionList() + '</div>'
      : '<div class="grid">' + categoryManager() + dataPanel() + '</div>';

    root.innerHTML =
      '<div class="app">' +
        '<header class="app__header">' +
          '<div class="brand"><span class="brand__mark">◍</span><h1>Monthly Budget</h1></div>' +
          monthNav() +
          '<button class="btn btn--primary" data-act="new-tx">+ Transaction</button>' +
        '</header>' +
        '<nav class="tabs">' +
          '<button class="tab' + (ui.tab === 'overview' ? ' tab--active' : '') + '" data-act="tab" data-tab="overview">Overview</button>' +
          '<button class="tab' + (ui.tab === 'manage' ? ' tab--active' : '') + '" data-act="tab" data-tab="manage">Manage</button>' +
        '</nav>' +
        '<main class="app__main">' + main + '</main>' +
        '<footer class="app__footer">Private &amp; offline · your data stays in this browser</footer>' +
      '</div>' +
      transactionModal();

    // Post-render focus management.
    if (ui.focusAfter) {
      var el = root.querySelector(ui.focusAfter);
      if (el) { el.focus(); if (el.select) el.select(); }
      ui.focusAfter = null;
    }
  }

  // ---- Event handling -----------------------------------------------------
  var root = document.getElementById('root');
  var pendingColor = PALETTE[0];

  root.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (t) {
      var act = t.getAttribute('data-act');
      var id = t.getAttribute('data-id');
      switch (act) {
        case 'prev-month': ui.month = shiftMonth(ui.month, -1); return render();
        case 'next-month': ui.month = shiftMonth(ui.month, 1); return render();
        case 'today': ui.month = currentMonthKey(); return render();
        case 'tab': ui.tab = t.getAttribute('data-tab'); ui.editingCatId = null; return render();
        case 'new-tx': ui.form = {}; ui.focusAfter = '[data-role="tx-amount"]'; return render();
        case 'quick-add': ui.form = { categoryId: id }; ui.focusAfter = '[data-role="tx-amount"]'; return render();
        case 'edit-tx':
          var tx = state.transactions.filter(function (x) { return x.id === id; })[0];
          if (tx) { ui.form = { editing: tx }; ui.focusAfter = '[data-role="tx-amount"]'; render(); }
          return;
        case 'del-tx': actions.deleteTransaction(id); return commit();
        case 'close-modal': ui.form = null; return render();
        case 'edit-cat':
          ui.editingCatId = id;
          ui.focusAfter = '[data-role="cat-budget-input"][data-id="' + id + '"]';
          return render();
        case 'del-cat':
          var cat = state.categories.filter(function (x) { return x.id === id; })[0];
          if (cat && confirm('Delete "' + cat.name + '"? Its transactions will be removed too.')) {
            actions.deleteCategory(id); commit();
          }
          return;
        case 'export': return exportBackup();
        case 'import':
          var fi = root.querySelector('[data-role="import-file"]');
          if (fi) fi.click();
          return;
        case 'reset':
          if (confirm('Reset everything back to the starter categories? This clears all transactions.')) {
            actions.resetAll(); commit();
          }
          return;
      }
    }
    // Color swatches (add-category form).
    var sw = e.target.closest('[data-role="swatch"]');
    if (sw) {
      pendingColor = sw.getAttribute('data-color');
      Array.prototype.forEach.call(root.querySelectorAll('[data-role="swatch"]'), function (x) {
        x.classList.toggle('swatch--active', x === sw);
      });
    }
  });

  // Submit handlers (transaction form + add-category form).
  root.addEventListener('submit', function (e) {
    if (e.target.matches('[data-role="tx-form"]')) {
      e.preventDefault();
      var f = e.target;
      var amount = Number(f.querySelector('[data-role="tx-amount"]').value);
      var categoryId = f.querySelector('[data-role="tx-category"]').value;
      var date = f.querySelector('[data-role="tx-date"]').value || todayIso();
      var note = f.querySelector('[data-role="tx-note"]').value.trim();
      var err = f.querySelector('[data-role="tx-error"]');
      if (!categoryId) { err.textContent = 'Pick a category first.'; err.style.display = 'block'; return; }
      if (!isFinite(amount) || amount <= 0) { err.textContent = 'Enter an amount greater than zero.'; err.style.display = 'block'; return; }
      var payload = { amount: Math.round(amount * 100) / 100, categoryId: categoryId, date: date, note: note };
      if (ui.form && ui.form.editing) actions.updateTransaction(ui.form.editing.id, payload);
      else actions.addTransaction(payload);
      ui.form = null;
      return commit();
    }
    if (e.target.matches('[data-role="cat-add"]')) {
      e.preventDefault();
      var cf = e.target;
      var name = cf.querySelector('[data-role="cat-name"]').value.trim();
      var type = cf.querySelector('[data-role="cat-type"]').value;
      var budget = Number(cf.querySelector('[data-role="cat-budget"]').value);
      if (!name || !isFinite(budget) || budget < 0) return;
      actions.addCategory({ name: name, type: type, budget: Math.round(budget * 100) / 100, color: pendingColor });
      pendingColor = PALETTE[0];
      return commit();
    }
  });

  // Inline category-budget editing + currency change.
  root.addEventListener('change', function (e) {
    if (e.target.matches('[data-role="currency"]')) {
      actions.setCurrency(e.target.value);
      return commit();
    }
    if (e.target.matches('[data-role="import-file"]')) {
      var file = e.target.files && e.target.files[0];
      if (file) importBackup(file);
      e.target.value = '';
    }
  });

  root.addEventListener('blur', function (e) {
    if (e.target.matches('[data-role="cat-budget-input"]')) commitCatBudget(e.target);
  }, true);

  root.addEventListener('keydown', function (e) {
    if (e.target.matches('[data-role="cat-budget-input"]')) {
      if (e.key === 'Enter') { e.preventDefault(); commitCatBudget(e.target); }
      else if (e.key === 'Escape') { ui.editingCatId = null; render(); }
    }
    if (e.key === 'Escape' && ui.form) { ui.form = null; render(); }
  });

  function commitCatBudget(input) {
    var id = input.getAttribute('data-id');
    // Guard against re-entrancy: pressing Enter commits and re-renders, which
    // removes the input and fires blur — this second call must be a no-op.
    if (ui.editingCatId !== id) return;
    ui.editingCatId = null;
    var value = Number(input.value);
    if (isFinite(value) && value >= 0) actions.updateCategory(id, { budget: Math.round(value * 100) / 100 });
    commit();
  }

  // ---- Backup export / import --------------------------------------------
  function exportBackup() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'budget-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }
  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        if (parsed && Array.isArray(parsed.categories) && Array.isArray(parsed.transactions)) {
          state = { currency: parsed.currency || 'USD', categories: parsed.categories, transactions: parsed.transactions };
          commit();
        } else {
          alert('That file does not look like a budget backup.');
        }
      } catch (err) {
        alert('Could not read that file.');
      }
    };
    reader.readAsText(file);
  }

  render();
})();
</script>
</body>
</html>
